<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palestrantes - Semana Tecnológica UCPel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <img src="imagen/logo.ucpel.png" alt="Logo UCPel" class="logo">
        <nav>
            <a href="index.html">Início</a>
        </nav>
    </header>

    <main>
        <section id="lista-palestrantes">
            <h1>Palestrantes</h1>
            <p>Conheça quem vai compartilhar conhecimento na Semana Tecnológica 2026.</p>

            <div class="palestrantes-grid">

                <div class="card-palestrante">
                    <img src="imagens/palestrante1.jpg" alt="Foto do palestrante 1">
                    <h2>Tales R Marques.</h2>
                    <p class="area">Especialista em IA.</p>
                </div>

                <div class="card-palestrante">
                    <img src="imagens/palestrante2.jpg" alt="Foto do palestrante 2">
                    <h2>Alexandra D Rosa.</h2>
                    <p class="area">Desenvolvimento web.</p>
                </div>

                <div class="card-palestrante">
                    <img src="imagens/palestrante3.jpg" alt="Foto do palestrante 3">
                    <h2>Rafael Andrade.</h2>
                    <p class="area">Especialista em cyber segurança.</p>
                </div>

            </div>
        </section>

        <section id="inscricoes-palestrantes">
            <h2>Inscrições</h2>
            <form>
                <label for="nome">Nome completo *</label>
                <input type="text" id="nome" name="nome" required>

                <label for="telefone">Telefone *</label>
                <input type="tel" id="telefone" name="telefone" required>

                <label for="email">E-mail *</label>
                <input type="email" id="email" name="email" required>

                <button type="submit">Confirmar inscrição</button>
            </form>
        </section>
    </main>

    <footer>
        <p>Contato: ................</p>
    </footer>

</body>
</html>
